

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UMBC Campus Map</title>
  <button id="sidebarToggle" style="display:none; background:none; border:none; font-size:24px; cursor:pointer;">☰</button>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header">
    Grit Guide

    <img id="umbcLogo" src="images/UMBC-primary-logo-RGB.png" alt="UMBC Logo" class="logo">
  </div>

  <div id="main-container">
    <div id="sidebar">
      <div id="tabs">
        <button class="tab active" id="tabSearch">Search Building</button>
        <button class="tab" id="tabRoute">Find Route</button>
      </div>

      <div id="tabContent">
        <div id="searchContent">
          <input id="searchInput" type="text" placeholder="Enter building name..." autocomplete="off">
          <div id="suggestions"></div>
          <button id="searchButton">Search</button>
        </div>

        <div id="routeContent" style="display:none">
          <input id="fromInput" type="text" placeholder="From: Enter building name...">
          <input id="toInput" type="text" placeholder="To: Enter building name...">
          <div id="fromSuggestions" class="suggestions-box"></div>
          <div id="toSuggestions" class="suggestions-box"></div>
          <button id="routeButton">Find Route</button>
          <button id="trackButton">Start Live Tracking</button>
          <button id="stopTrackButton">Stop Live Tracking</button>
          <div id="instructions"></div>
        </div>
      </div>

      <div id="legend">
        <h3>Resources</h3>
        <div class="legend-item">
          <div class="dropdown-section">
      
            <!-- Buildings -->
            <label for="buildingDropdown"><strong>Buildings</strong></label>
            <select id="buildingDropdown" onchange="filterByCategory(this)">
              <option value="">Select a building</option>
              <option value="Administration Building">Administration Building</option>
              <option value="Albin O. Kuhn Library">Albin O. Kuhn Library</option>
              <option value="The Commons">The Commons</option>
              <option value="Engineering Building">Engineering Building</option>
              <option value="Fine Arts Building">Fine Arts Building</option>
              <option value="Information Technology (ITE)">Information Technology (ITE)</option>
              <option value="Math and Psychology Building">Math and Psychology Building</option>
              <option value="Physics Building">Physics Building</option>
              <option value="Public Policy Building">Public Policy Building</option>
              <option value="Retriever Activities Center (RAC)">Retriever Activities Center (RAC)</option>
              <option value="Sherman Hall">Sherman Hall</option>
              <option value="Sondheim Hall">Sondheim Hall</option>
              <option value="Lecture Hall 1">Lecture Hall 1</option>
              <option value="University Center">University Center</option>
            </select>
      
            <!-- Dining -->
            <label for="diningDropdown"><strong>Dining</strong></label>
            <select id="diningDropdown" onchange="filterByCategory(this)">
              <option value="">Select a dining place</option>
              <option value="Halal Shack">Halal Shack</option>
              <option value="True Grits">True Grits</option>
              <option value="Starbucks">Starbucks</option>
              <option value="Chick Fil A">Chick Fil A</option>
              <option value="Subway">Subway</option>
              <option value="Einstein Bros Bagels">Einstein Bros Bagels</option>
              <option value="Sushi Do">Sushi Do</option>
              <option value="2.Mato">2.Mato</option>
              <option value="The Market Place">The Market Place</option>
              <option value="Yum Shoppe">Yum Shoppe</option>
              <option value="Wild Greens">Wild Greens</option>
              <option value="Indian Kitchen">Indian Kitchen</option>
              <option value="Copperhead Jack's">Copperhead Jack's</option>
              <option value="Absurd Bird and Burgers">Absurd Bird and Burgers</option>
              <option value="Dunkin">Dunkin</option>
              <option value="The Coffee Shop">The Coffee Shop</option>
            </select>
      
            <!-- Parking -->
            <label for="parkingDropdown"><strong>Parking</strong></label>
            <select id="parkingDropdown" onchange="filterByCategory(this)">
              <option value="">Select a parking lot</option>
              <option value="Lot 1">Lot 1</option>
              <option value="Lot 2">Lot 2</option>
              <option value="Lot 3">Lot 3</option>
              <option value="Lot 4">Lot 4</option>
              <option value="Lot 5">Lot 5</option>
              <option value="Lot 6">Lot 6</option>
              <option value="Lot 7">Lot 7</option>
              <option value="Lot 8">Lot 8</option>
              <option value="Lot 9">Lot 9</option>
              <option value="Lot 10">Lot 10</option>
              <option value="Lot 11">Lot 11</option>
              <option value="Lot 12">Lot 12</option>
              <option value="Lot 13">Lot 13</option>
              <option value="Lot 14">Lot 14</option>
              <option value="Lot 15">Lot 15</option>
              <option value="Lot 16">Lot 16</option>
              <option value="Lot 17">Lot 17</option>
              <option value="Lot 18">Lot 18</option>
              <option value="Lot 19">Lot 19</option>
              <option value="Lot 20">Lot 20</option>
              <option value="Lot 21">Lot 21</option>
              <option value="Lot 22">Lot 22</option>
              <option value="Lot 23">Lot 23</option>
              <option value="Lot 24">Lot 24</option>
              <option value="Lot 25">Lot 25</option>
              <option value="Lot 26">Lot 26</option>
              <option value="Lot 27">Lot 27</option>
              <option value="Lot 28">Lot 28</option>
              <option value="Lot 29">Lot 29</option>
              <option value="Lot 30">Lot 30</option>
              <option value="Lot 31">Lot 31</option>
              <option value="Stadium Lot">Stadium Lot</option>
              <option value="Walker Avenue Garage">Walker Avenue Garage</option>
              <option value="Commons Garage">Commons Garage</option>
            </select>
      
            <!-- Residence -->
            <label for="residenceDropdown"><strong>Residence Halls</strong></label>
            <select id="residenceDropdown" onchange="filterByCategory(this)">
              <option value="">Select a residence</option>
              <option value="Chesapeake Hall">Chesapeake Hall</option>
              <option value="Erickson Hall">Erickson Hall</option>
              <option value="Harbor Hall">Harbor Hall</option>
              <option value="Patapsco Hall">Patapsco Hall</option>
              <option value="Potomac Hall">Potomac Hall</option>
              <option value="Susquehanna Hall">Susquehanna Hall</option>
              <option value="Walker Avenue Apartments">Walker Avenue Apartments</option>
              <option value="Breton (BRE)">Breton</option>
              <option value="Casselman (CAS)">Casselman</option>
              <option value="Choptank (CHO)">Choptank</option>
              <option value="Conowingo (CON)">Conowingo</option>
              <option value="Denton (DEN)">Denton</option>
              <option value="Gunpowder (GUN)">Gunpowder</option>
              
              

            </select>
      
          </div>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script src="script-2.js"></script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCvd4ccDAWW8HsuKMYg7aqLgcQzpdFZm2Q&callback=initMap"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
